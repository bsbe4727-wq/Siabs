.side{padding:28px}.side-title{font:800 18px Manrope;margin-bottom:18px}.stat{padding:16px;border-radius:17px;background:#f7faff;border:1px solid #edf1f7;margin-bottom:10px}.stat small{display:block;color:#8a96a9;text-transform:uppercase;font-size:9px;letter-spacing:.12em}.stat strong{display:block;font:800 28px Manrope;margin-top:4px}.stat span{color:#17a177;font-size:10px;font-weight:700}.admin-note{margin-top:17px;padding:15px;border-radius:16px;background:#112946;color:#c9d8e9}.admin-note b{display:block;color:#fff;font-size:12px;margin-bottom:5px}.admin-note span{font-size:10px;line-height:1.6}

.attendance-modal{
 position:fixed!important; inset:0!important; z-index:999999!important;

/* Riwayat presensi: scroll di dalam tabel */
.history-table-wrap{
    max-height:360px;
    overflow-y:auto;
    overflow-x:auto;
    border:1px solid #e7ebf1;
    border-radius:14px;

}

    position:sticky;

/* Notifikasi toast kecil dinonaktifkan; hasil absensi memakai popup utama. */

<div class="modal show" id="modal">
 <div class="login">
  <div class="icon">N1</div><h2>Login Admin</h2><p>Masuk untuk membuka panel pengelolaan sistem absensi.</p>
